[pytest]
testpaths = tests
pythonpath = apps/search-service
addopts = --strict-markers
markers =
    unit: fast isolated tests
    integration: tests exercising several components or real services
    e2e: tests against the full docker compose stack
    req(id): links a test to a requirement (e.g. REQ-0001)
    issue(number): links a test to a GitHub issue number
