services:
  api:
    build: ./apps/api
    ports: ["3000:3000"]
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/consumer_service_search
      REDIS_URL: redis://redis:6379
    depends_on: [db, redis, search-service]
  search-service:
    build: ./apps/search-service
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/consumer_service_search
      REDIS_URL: redis://redis:6379
    depends_on: [db, redis]
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: consumer_service_search
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  postgres-data:
