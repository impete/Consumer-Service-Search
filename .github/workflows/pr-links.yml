name: PR Links
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate references
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          text="$PR_BODY"$'\n'"$PR_BRANCH"
          issues=$(echo "$text" | grep -oE '#[0-9]+' | sort -u | tr '\n' ' ' || true)
          reqs=$(echo "$text" | grep -oE 'REQ-[0-9]{4}' | sort -u || true)
          adrs=$(echo "$text" | grep -oE 'ADR-[0-9]{4}' | sort -u || true)
          if [ -z "$issues$reqs$adrs" ]; then
            echo "::error::PR must reference an issue (#N), REQ-xxxx or ADR-xxxx"; exit 1
          fi
          fail=0
          for r in $reqs; do
            [ -f "docs/requirements/$r.md" ] || { echo "::error::Unknown $r"; fail=1; continue; }
            grep -rq --include='*.py' --include='*.ts' "$r" tests || echo "::warning::$r has no linked test"
          done
          for a in $adrs; do
            [ -f "docs/adr/$a.md" ] || { echo "::error::Unknown $a"; fail=1; }
          done
          {
            echo "### Traceability"
            echo "- Issues: ${issues:-none}"
            echo "- Requirements: $(echo $reqs)"
            echo "- ADRs: $(echo $adrs)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $fail
      - name: Sticky comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-links -->';
            const body = process.env.PR_BODY || '';
            const reqs = [...new Set(body.match(/REQ-\d{4}/g) || [])];
            const fs = require('fs');
            const rows = reqs.map(r => {
              const out = require('child_process').spawnSync('grep', ['-rl', '--include=*.py', '--include=*.ts', r, 'tests']).stdout.toString().trim().split('\n').filter(Boolean);
              return `| ${r} | ${out.length ? out.map(f => '`' + f + '`').join(', ') : '_none_'} |`;
            });
            const text = `${marker}\n### Requirement → test links\n| Requirement | Tests |\n|---|---|\n${rows.join('\n') || '| _none referenced_ | |'}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: text });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body: text });
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
