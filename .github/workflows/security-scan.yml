name: Security Scan
on:
  pull_request:
  schedule:
    - cron: '0 4 * * 1'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --prefix apps/api
      - run: npm --prefix apps/api audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pip-audit
      # -r makes pip-audit resolve the requirements in its own isolated
      # environment, so runner-provided packages (e.g. setuptools) are not audited.
      - run: pip-audit -r apps/search-service/requirements.txt
