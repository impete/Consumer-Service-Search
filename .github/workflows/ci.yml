name: CI
on:
  push:
    branches: [main]
    # bot commits of reports / coverage floor must not re-trigger CI
    paths-ignore:
      - 'tests/*/testrpts/**'
      - 'tests/coverage-floor.json'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: read
jobs:
  lint:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/search-service/requirements-dev.txt
      - run: npm ci --prefix apps/api
      - run: npm --prefix apps/api run lint
      - run: npm --prefix apps/api run build
      - run: pip install -r apps/search-service/requirements-dev.txt
      - run: black --check apps/search-service tests scripts
      - run: bash scripts/ci/validate-test-links.sh
  unit:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/search-service/requirements-dev.txt
      - run: npm ci --prefix apps/api
      - run: pip install -r apps/search-service/requirements-dev.txt
      - run: mkdir -p tests/unit/testrpts
      - run: pytest tests/unit -q -m "not noncritical" --junitxml=tests/unit/testrpts/pytest-junit.xml
      - run: >
          npm --prefix apps/api run test:unit --
          -t "^(?!.*@noncritical)"
          --outputFile.junit=../../tests/unit/testrpts/vitest-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-reports
          path: tests/unit/testrpts/
          if-no-files-found: ignore
  integration:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/search-service/requirements-dev.txt
      - run: npm ci --prefix apps/api
      - run: pip install -r apps/search-service/requirements-dev.txt
      - run: mkdir -p tests/integration/testrpts
      - run: pytest tests/integration -q -m "not noncritical" --junitxml=tests/integration/testrpts/pytest-junit.xml
      - run: >
          npm --prefix apps/api run test:integration --
          -t "^(?!.*@noncritical)"
          --outputFile.junit=../../tests/integration/testrpts/vitest-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-reports
          path: tests/integration/testrpts/
          if-no-files-found: ignore
  coverage:
    # Critical unit + integration tests; fails if coverage drops below tests/coverage-floor.json
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/search-service/requirements-dev.txt
      - run: npm ci --prefix apps/api
      - run: pip install -r apps/search-service/requirements-dev.txt
      - run: mkdir -p tests/integration/testrpts
      - run: >
          pytest tests/unit tests/integration -q -m "not noncritical"
          --cov=apps/search-service/app
          --cov-report=json:tests/integration/testrpts/coverage-python.json
          --cov-report=term-missing
      - run: >
          npm --prefix apps/api test --
          -t "^(?!.*@noncritical)"
          --outputFile.junit=../../tests/integration/testrpts/coverage-run-junit.xml
          --coverage.reportsDirectory=../../tests/integration/testrpts/api-coverage
          --coverage.reporter=text --coverage.reporter=json-summary
      - run: python scripts/ci/coverage_gate.py check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: tests/integration/testrpts/
          if-no-files-found: ignore
  e2e:
    # Only for PRs labeled `critical`; everything else is covered by nightly.yml
    if: >
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'critical') &&
      (github.event.action != 'labeled' || github.event.label.name == 'critical')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/search-service/requirements-dev.txt
      - run: pip install -r apps/search-service/requirements-dev.txt
      - run: mkdir -p tests/e2e/testrpts
      - run: docker compose up -d --build
      - name: Wait for services
        run: |
          for url in http://localhost:3000/health http://localhost:8000/health; do
            for _ in $(seq 1 30); do curl -fs "$url" && break; sleep 2; done
          done
      - run: E2E=1 pytest tests/e2e -q --junitxml=tests/e2e/testrpts/pytest-junit.xml
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-reports
          path: tests/e2e/testrpts/
          if-no-files-found: ignore
  docker-build:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    needs: [lint, unit, integration]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t consumer-search-api ./apps/api
      - run: docker build -t consumer-search-search ./apps/search-service
  publish-reports:
    # PRs: sticky comment with results. Pushes to main: bot commits reports and ratchets the floor.
    if: always() && !cancelled() && github.event.action != 'labeled'
    needs: [unit, integration, coverage, e2e]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-reports-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: unit-reports
          path: tests/unit/testrpts
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: integration-reports
          path: tests/integration/testrpts
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-reports
          path: tests/integration/testrpts
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: e2e-reports
          path: tests/e2e/testrpts
      - name: Raise coverage floor (main only)
        if: github.event_name == 'push' && needs.unit.result == 'success' && needs.integration.result == 'success' && needs.coverage.result == 'success'
        run: python scripts/ci/coverage_gate.py raise
      - name: Summarize
        run: |
          python scripts/ci/summarize_reports.py | tee "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Sticky PR comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- test-reports -->';
            const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/summary.md`, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
      - name: Commit reports (main only)
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tests/unit/testrpts tests/integration/testrpts tests/e2e/testrpts tests/coverage-floor.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(bot): update test reports and coverage floor [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
