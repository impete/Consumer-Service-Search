name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/search-service/requirements-dev.txt
      - run: npm ci --prefix apps/api
      - run: npm --prefix apps/api run lint
      - run: npm --prefix apps/api run build
      - run: pip install -r apps/search-service/requirements-dev.txt
      - run: black --check apps/search-service tests
      - run: bash scripts/ci/validate-test-links.sh
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/search-service/requirements-dev.txt
      - run: npm ci --prefix apps/api
      - run: pip install -r apps/search-service/requirements-dev.txt
      - run: >
          pytest tests/unit -q --junitxml=reports/unit.xml
          --cov=apps/search-service/app --cov-report=xml:reports/coverage.xml
          --cov-report=term-missing
      - run: npm --prefix apps/api run test:unit
      - name: Summary
        if: always()
        run: |
          echo "### Unit tests" >> "$GITHUB_STEP_SUMMARY"
          grep -o '<testsuite [^>]*' reports/unit.xml >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-reports
          path: reports/
          if-no-files-found: ignore
  integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: consumer_service_search
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
    env:
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/consumer_service_search
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/search-service/requirements-dev.txt
      - run: npm ci --prefix apps/api
      - run: pip install -r apps/search-service/requirements-dev.txt
      - run: pytest tests/integration -q --junitxml=reports/integration.xml
      - run: npm --prefix apps/api run test:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-reports
          path: reports/
          if-no-files-found: ignore
  e2e:
    runs-on: ubuntu-latest
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/search-service/requirements-dev.txt
      - run: pip install -r apps/search-service/requirements-dev.txt
      - run: docker compose up -d --build
      - name: Wait for services
        run: |
          for url in http://localhost:3000/health http://localhost:8000/health; do
            for _ in $(seq 1 30); do curl -fs "$url" && break; sleep 2; done
          done
      - run: E2E=1 pytest tests/e2e -q --junitxml=reports/e2e.xml
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-reports
          path: reports/
          if-no-files-found: ignore
  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, unit, integration]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t consumer-search-api ./apps/api
      - run: docker build -t consumer-search-search ./apps/search-service
